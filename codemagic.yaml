# AuraLift — build iOS per App Store Connect (TestFlight).
#
# Prerequisiti (già configurati): profilo "auralift_appstore" (App Store, com.ikonet.auralift) e certificato
# "ithelpdesk_distribution_20260916" in Codemagic › Code signing identities.
# Gli ID AdMob reali (non segreti) sono in .env.production e ios/App/App/Info.plist.
workflows:
  ios-app-store:
    name: AuraLift iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m4
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    integrations:
      app_store_connect: Ikonet Solutions
    environment:
      ios_signing:
        provisioning_profiles:
          - auralift_appstore
        certificates:
          - ithelpdesk_distribution_20260916
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.ikonet.auralift
      xcode: latest
      node: 22
    scripts:
      - name: Check AdMob IDs (no test ads in production)
        script: |
          grep -q "^VITE_ADMOB_IOS_BANNER=ca-app-pub-1151868778464777/" .env.production
          grep -q "ca-app-pub-1151868778464777~" ios/App/App/Info.plist
      - name: Install npm dependencies
        script: npm ci
      - name: Unit tests
        script: npm test
      - name: Build web app and sync iOS project
        script: |
          npm run build
          npx cap sync ios
      - name: Set up signing profiles
        script: xcode-project use-profiles
      - name: Apply version and build number
        script: |
          cd ios/App
          agvtool new-marketing-version "$(node -p "require('../../package.json').version")"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build IPA for App Store Connect
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
